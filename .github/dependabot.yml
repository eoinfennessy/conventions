# Keeps cargo dependencies and SHA-pinned GitHub Actions current.

version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    cooldown:
      default-days: 7
    schedule:
      interval: weekly
      day: monday
    groups:
      cargo-minor-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    # Scan both the workflows and every local composite action, since a bare
    # "/" only covers .github/workflows. These composite actions are consumed
    # by other repos at a pinned SHA, so their pins must not go stale here.
    directories:
      - "/"
      - "/.github/actions/*"
    cooldown:
      default-days: 7
    schedule:
      interval: weekly
      day: monday

  - package-ecosystem: docker
    directory: /
    cooldown:
      default-days: 7
    schedule:
      interval: weekly
      day: monday
    ignore:
      # Builder image tracks the MSRV, not Dependabot; allow Alpine patch bumps.
      - dependency-name: "rust"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
